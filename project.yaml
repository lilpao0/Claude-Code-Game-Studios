# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Technical Setup

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: full
  automation: autonomous

engine:
  name: "Unity"
  version: "6.3 LTS"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  # TODO: no Unity 6.3 editor at pin time (2026-11-01). Found: 6000.4.0f1 at
  # D:/Dev/Unity/6000.4.0f1/Editor/Unity.exe (mismatched line; decision: pin 6.3,
  # install 6.3 later). Set path: to the 6.3 editor's full path once installed.

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unity/; confirm before
                               # relying on it (Unity skill note: PascalCase or
                               # UPPER_SNAKE_CASE both appear in its own prose)
  signals: PascalCase On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # TODO: confirm these once a Unity 6.3 editor is installed — set via /settings.
  # Build target chosen 2026-11-01: Windows 64-bit (Steam MVP per docs 23/24).
  build: '"<Unity editor>" -batchmode -quit -projectPath . -buildTarget StandaloneWindows64 -buildWindows64Player Builds/Windows64/CurioDistrict.exe'
  test: '"<Unity editor>" -batchmode -runTests -projectPath . -testPlatform EditMode -testResults test-results/editmode.xml'
  run: "Builds/Windows64/CurioDistrict.exe -screen-width 1280 -screen-height 720 -screen-fullscreen 0"
  smoke: '"<Unity editor>" -batchmode -quit -projectPath . -logFile -'
